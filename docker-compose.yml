services:
  transcriber:
    build: .
    container_name: transcriber
    runtime: nvidia
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_HOME=/root/.cache/huggingface
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./hf_host:/root/.cache/huggingface 
